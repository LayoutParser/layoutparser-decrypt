name: LayoutParserDecrypt - Build

# Actions pinadas por SHA completo (com tag em comentário) — hardening de supply-chain,
# mesmo padrão adotado em layoutparser-portal e replicado aqui por paridade
# (ver .claude/agent-memory/lp-devops para o pedido original). Uma tag mutável (@v4) pode ser
# recriada apontando pra outro commit; o SHA não.

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

# Evita empilhar builds duplicados quando o mesmo branch/PR recebe pushes em sequência.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.4.1
        with:
          dotnet-version: "10.0.x"

      # Projeto principal continua net48 (ver comentário em LayoutParserDecrypt.csproj: a
      # chave/IV do RijndaelManaged não são tamanhos válidos de AES, e o RijndaelManaged de
      # .NET Core+/.NET moderno é só um shim sobre AES) — SDK-style, então `dotnet build`
      # resolve normalmente mesmo sendo net48.
      - name: Restore
        shell: pwsh
        run: dotnet restore .\LayoutParserDecrypt.sln

      - name: Build (Release)
        shell: pwsh
        run: dotnet build .\LayoutParserDecrypt.sln -c Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test .\LayoutParserDecrypt.sln -c Release --no-build

      # Pacote implantável: exe + .config + scripts (a lib está embutida no exe, sem DLLs extras).
      # Saída SDK-style: bin\Release\net48\ (não bin\Release\).
      - name: Package (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\pkg\scripts | Out-Null
          Copy-Item bin\Release\net48\LayoutParserDecrypt.exe dist\pkg\
          Copy-Item bin\Release\net48\LayoutParserDecrypt.exe.config dist\pkg\ -ErrorAction SilentlyContinue
          Copy-Item scripts\*.ps1 dist\pkg\scripts\
          Compress-Archive -Path dist\pkg\* -DestinationPath dist\LayoutParserDecrypt.zip

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LayoutParserDecrypt
          path: dist\LayoutParserDecrypt.zip
