name: CodeQL Security Analysis

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# O workflow apenas le o codigo e publica resultados de code scanning.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # PRs, inclusive de forks, executam exclusivamente em runner hospedado pelo GitHub.
    # Nunca substituir por self-hosted neste workflow de analise de codigo nao confiavel.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - csharp
          - actions

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # build-mode: none - este projeto e standalone (LayoutParserLib foi embutido como
      # arquivos-fonte locais, ver comentario em LayoutParserDecrypt.csproj), entao nao tem o
      # problema de HintPath para repo irmao que a API tem. Ainda assim e um projeto classico
      # nao-SDK (TargetFrameworkVersion v4.8.1) que so builda de verdade via MSBuild em
      # windows-latest (ver .github/workflows/build.yml) - dotnet/autobuild em ubuntu-latest
      # nao builda esse projeto. build-mode: none evita esse descompasso: roda em
      # ubuntu-latest (mesmo padrao dos outros repos do ecossistema) sem tentar compilar,
      # fazendo extracao/analise direta do codigo fonte. Se quiser profundidade equivalente a
      # um build real no futuro, a alternativa e build-mode: manual em windows-latest
      # reaproveitando os steps de setup-msbuild/nuget restore/msbuild do build.yml.
      - name: Inicializar CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analisar e publicar resultados
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
