name: Gitleaks (secret scan)

# Paridade com LayoutParserApi/.github/workflows/gitleaks.yml — rede de segurança, ainda que
# este repositório não deva versionar segredo nenhum hoje (é o cliente .exe de descriptografia,
# sem connection string/API key próprias). Usa o binário oficial do gitleaks direto via CLI
# (não a Action gitleaks/gitleaks-action@v2, que exige licença paga para repositórios de
# ORGANIZAÇÃO desde 2025) — mesma decisão já tomada na API, sem custo.
#
# Roda em TODO PR contra master OU develop (fluxo real: feat/** -> develop -> master,
# mesmo padrão já usado no LayoutParserApi — develop foi criada em 2026-09-25).

on:
  pull_request:
    branches:
      - master
      - main
      - develop

concurrency:
  group: gitleaks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historico completo do PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (binario oficial, sem licenca)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Escaneia apenas o diff introduzido pelo PR (range contra a base), não o histórico
      # inteiro — mesmo mecanismo (e mesmo bugfix de fetch) já validado na API em 2026-08-17.
      - name: Gitleaks - scan do diff do PR
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          gitleaks detect \
            --source . \
            --log-opts="--no-merges --first-parent origin/${{ github.event.pull_request.base.ref }}..HEAD" \
            --config .gitleaks.toml \
            --redact \
            --verbose
